[project]
name = "rag-ollama"
version = "0.1.0"
description = "RAG API using ollama and fastapi"
readme = "README.md"
authors = [
    { name = "Arzy", email = "fatih.arrazy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.2",
    "ollama>=0.6.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-ollama = "rag_ollama:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
